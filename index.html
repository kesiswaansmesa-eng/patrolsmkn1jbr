    <script>
      // Defensive shim: allow browser extensions to set window.fetch even if original descriptor has only a getter
      (function() {
        try {
          var origFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window) || {}, 'fetch');
          if (!desc || (!desc.writable && !desc.set)) {
            var currentFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch setter shim error:', e);
        }
      })();
    </script>
